workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_play
    scripts:
      - name: Grant execute permission to gradlew
        script: |
          chmod +x gradlew
      - name: Build Android AAB
        script: |
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
