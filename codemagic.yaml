workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      groups:
        - google_play
    scripts:
      - name: Build Android App Bundle
        script: |
          # 1. Ana dizinde olduğumuzdan emin olalım
          cd $CM_BUILD_DIR
          
          # 2. key.properties dosyasını doğru yere oluşturalım
          mkdir -p app
          rm -f app/key.properties
          echo "storePassword=12531253" > app/key.properties
          echo "keyPassword=12531253" >> app/key.properties
          echo "keyAlias=my-key-alias" >> app/key.properties
          echo "storeFile=../release.keystore" >> app/key.properties
          
          # 3. gradlew için yetki verelim ve build alalım
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/bundle/release/app-release.aab
