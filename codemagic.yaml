workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      groups:
        - google_play
    scripts:
      - name: Build Android App Bundle
        script: |
          # Doğru dizine geçelim
          cd $(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
          
          # Bozuk/eksik gradle-wrapper.jar dosyasını resmi kaynaktan tekrar indirelim
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          
          # key.properties dosyasını oluşturalım
          mkdir -p app
          rm -f app/key.properties
          echo "storePassword=12531253" > app/key.properties
          echo "keyPassword=12531253" >> app/key.properties
          echo "keyAlias=my-key-alias" >> app/key.properties
          echo "storeFile=../release.keystore" >> app/key.properties
          
          # Yetkiyi verip build alalım
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - "**/app/build/outputs/bundle/release/app-release.aab"
