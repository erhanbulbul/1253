workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      groups:
        - google_play
    scripts:
      - name: Build Android App Bundle
        script: |
          # Proje klasörüne geçelim
          cd $CM_BUILD_DIR/1253
          
          # Gradle wrapper jar ve properties ayarları
          mkdir -p gradle/wrapper
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar
          
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # Çevre değişkeni ve local.properties dosyaları
          touch .env.example
          touch .env
          echo "GEMINI_API_KEY=AIzaSyDummyKeyForCompilation12345" > local.properties
          
          # Keystore dosyasını ana dizinden alıp her iki kritik konuma da kopyalayalım
          if [ -f "$CM_BUILD_DIR/release.keystore" ]; then
            cp "$CM_BUILD_DIR/release.keystore" /Users/builder/clone/1253/debug.keystore
            cp "$CM_BUILD_DIR/release.keystore" /Users/builder/clone/1253/app/debug.keystore
            cp "$CM_BUILD_DIR/release.keystore" /Users/builder/clone/1253/release.keystore
          elif [ -f "../release.keystore" ]; then
            cp ../release.keystore /Users/builder/clone/1253/debug.keystore
            cp ../release.keystore /Users/builder/clone/1253/app/debug.keystore
            cp ../release.keystore /Users/builder/clone/1253/release.keystore
          else
            # Dosya bulunamazsa güvenli bir debug keystore üretelim
            keytool -genkey -v -keystore /Users/builder/clone/1253/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 12531253 -keypass 12531253
            cp /Users/builder/clone/1253/debug.keystore /Users/builder/clone/1253/app/debug.keystore
            cp /Users/builder/clone/1253/debug.keystore /Users/builder/clone/1253/release.keystore
          fi
          
          # Dosyaların varlığını loglarda doğrulayalım
          ls -la /Users/builder/clone/1253/debug.keystore
          ls -la /Users/builder/clone/1253/app/debug.keystore
          
          # key.properties dosyalarını mutlak yollarla güncelleyelim
          rm -f key.properties app/key.properties
          
          echo "storePassword=12531253" > key.properties
          echo "keyPassword=12531253" >> key.properties
          echo "keyAlias=androiddebugkey" >> key.properties
          echo "storeFile=/Users/builder/clone/1253/debug.keystore" >> key.properties
          
          mkdir -p app
          echo "storePassword=12531253" > app/key.properties
          echo "keyPassword=12531253" >> app/key.properties
          echo "keyAlias=androiddebugkey" >> app/key.properties
          echo "storeFile=/Users/builder/clone/1253/debug.keystore" >> app/key.properties
          
          # Yetki verip, önbelleği temizleyerek build alalım
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-configuration-cache
    artifacts:
      - "**/app/build/outputs/bundle/release/app-release.aab"
