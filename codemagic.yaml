workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      groups:
        - google_play
    scripts:
      - name: Prepare Environment and Generate Files
        script: |
          cd $CM_BUILD_DIR/1253
          
          # 1. Gradle Wrapper Sürüm Sabitleme
          mkdir -p gradle/wrapper
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar
          
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # 2. Local Properties ve Çevre Değişkenleri
          echo "GEMINI_API_KEY=AIzaSyDummyKeyForCompilation12345" > local.properties
          touch .env
          
          # 3. Kotlin Derleme Hatası İçin Sabit Tanımı (GeminiLegacyService için)
          mkdir -p app/src/main/java/com/example/data/remote
          cat << 'EOF' > app/src/main/java/com/example/data/remote/GeminiConfig.kt
          package com.example.data.remote
          
          const val GEMINI_API_KEY = "AIzaSyDummyKeyForCompilation12345"
          EOF
          
          # 4. Keystore Dosyasını Kesin Olarak Üret ve Doğrula
          rm -f /Users/builder/clone/1253/debug.keystore
          keytool -genkey -v -keystore /Users/builder/clone/1253/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass 12531253 -keypass 12531253 -noprompt
          
          # Dosyanın varlığını loglarda görelim
          ls -la /Users/builder/clone/1253/debug.keystore
          
          # 5. key.properties Dosyalarını Mutlak Yollarla Oluştur
          echo "storePassword=12531253" > key.properties
          echo "keyPassword=12531253" >> key.properties
          echo "keyAlias=androiddebugkey" >> key.properties
          echo "storeFile=/Users/builder/clone/1253/debug.keystore" >> key.properties
          
          mkdir -p app
          echo "storePassword=12531253" > app/key.properties
          echo "keyPassword=12531253" >> app/key.properties
          echo "keyAlias=androiddebugkey" >> app/key.properties
          echo "storeFile=/Users/builder/clone/1253/debug.keystore" >> app/key.properties
          
      - name: Build Android App Bundle
        script: |
          cd $CM_BUILD_DIR/1253
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --no-configuration-cache
    artifacts:
      - "**/app/build/outputs/bundle/release/app-release.aab"
