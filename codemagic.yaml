workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      groups:
        - google_play
    scripts:
      - name: Build Android App Bundle
        script: |
          # Önce ana dizindeki release.keystore dosyasını proje klasörünün içine taşıyalım/kopyalayalım
          cp $CM_BUILD_DIR/release.keystore $CM_BUILD_DIR/1253/ 2>/dev/null || true
          
          # Şimdi proje klasörüne geçelim
          cd $CM_BUILD_DIR/1253
          
          # Gradle wrapper jar ve properties ayarları
          mkdir -p gradle/wrapper
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar
          
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # Çevre değişkeni dosyaları
          touch .env.example
          touch .env
          
          # Gradle'ın aradığı debug.keystore'u release.keystore ile eşitleyelim
          if [ -f "release.keystore" ]; then
            cp release.keystore debug.keystore
          fi
          
          # key.properties dosyalarını garantiye alalım
          rm -f key.properties app/key.properties
          
          echo "storePassword=12531253" > key.properties
          echo "keyPassword=12531253" >> key.properties
          echo "keyAlias=my-key-alias" >> key.properties
          echo "storeFile=release.keystore" >> key.properties
          
          mkdir -p app
          echo "storePassword=12531253" > app/key.properties
          echo "keyPassword=12531253" >> app/key.properties
          echo "keyAlias=my-key-alias" >> app/key.properties
          echo "storeFile=../release.keystore" >> app/key.properties
          
          # Yetki verip build alalım
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - "**/app/build/outputs/bundle/release/app-release.aab"
