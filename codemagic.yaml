workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      groups:
        - google_play
    scripts:
      - name: Create key.properties
        script: |
          mkdir -p app
          rm -f app/key.properties
          echo "storePassword=12531253" > app/key.properties
          echo "keyPassword=12531253" >> key.properties
          echo "keyAlias=my-key-alias" >> key.properties
          echo "storeFile=../release.keystore" >> key.properties
        working_directory: .
      - name: Grant execute permission for gradlew
        script: |
          chmod +x gradlew
        working_directory: .
      - name: Build Android AAB
        script: |
          ./gradlew bundleRelease
        working_directory: .
    artifacts:
      - app/build/outputs/bundle/release/app-release.aab
